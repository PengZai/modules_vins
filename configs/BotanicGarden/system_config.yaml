%YAML:1.0 # need to specify the file type at the top!

system:
  log_verbosity: "VERBOSE" # VERBOSE, KEY, QUIET
  max_cameras: 2 # number of cameras, 2 for stereo, 1 for monocular
  max_imus: 1 # number of IMUs
  max_stereo_time_offset: 0.02 # max time offset for stereo image pair (unit: second)


  num_feature_points: 1000
  threshold_for_tracking_descriptor_in_time:40.0 # for tracking cross time
  threshold_for_tracking_descriptor_in_frame:50.0 # for tracking cross images in same frame


  # relative config file name
  imu_config_name: "imu_config.yaml"
  camera_config_name: "camera_config.yaml"

  # visualization tool
  use_opencv_vis: 1
  use_rviz_vis: 1
  output_pose_rostopic: /output/camera_pose
  output_trajectory_rostopic: /output/trajectory
  output_tracked_map_points_rostopic: /output/tracked_points

  # debug
  check_triangulation: 0


  