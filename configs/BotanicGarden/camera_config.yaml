%YAML:1.0

cam0:
  name: dalsa_rgb0
  T_imu0_cam: #rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [-0.00140533,-0.00896721,0.99995881,0.18377395]
    - [-0.99999022,0.0042065,-0.00136765,0.14789743]
    - [-0.00419407,-0.99995095,-0.00897304,-0.0087318]
    - [0, 0, 0, 1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  # distortion_coeffs: [-0.060164620903866,0.094005180631043,0,0]
  distortion_coeffs: [0,0,0,0]
  distortion_model: radtan
  intrinsics: [642.9165664800531, 641.9171825800378, 460.1840658156501, 308.5846449100310] #fx, fy, cu, cv
  resolution: [960, 600] # width x height
  rgb_rostopic: /dalsa_rgb/left/image_raw
  output_rostopic: /output/left/image

  use_sensor_detph: 0
  sensor_depth_rostopic: "/dalsa_gray/left/foundation_stereo_depth"

  use_learned_depth: 0
  model_name_learned_depth: midas-model-v21-small-traced.pt
  learned_depth_rostopic: /camera/learned_depth/image

  use_stereo_matching: 0
  stereo_matching_rostopic: ""

  use_learned_stereo_matching: 0
  model_name_learned_stereo_matching: fast-acvnet-plus-generalization-traced.pt
  # model_name_learned_stereo_matching: foundation_stereo_model_best_bp2.pth.traced.pt
  learned_stereo_matching_rostopic: /camera/learned_stereo_matching/image

  use_learned_object_detection: 1
  model_name_learned_object_detection: yolov8n-botanic-garden.cuda.torchscript
  learned_object_detection_rostopic: /camera/object_detection/image

  use_learned_semantic_segmentation: 0
  model_name_learned_semantic_segmentation: yolov8n-seg-botanic-garden.cuda.torchscript
  learned_semantic_segmentation_rostopic: /camera/semantic_segmentation/image


cam1:
  name: dalsa_rgb1
  T_imu0_cam: #rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [-0.00120822,-0.00094742,0.99999882,0.18313715]
    - [-0.99997156,0.00744575,-0.00120114,-0.10587443]
    - [-0.00744461,-0.99997183,-0.00095639,-0.00933521]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  # distortion_coeffs: [-0.057705696896734,0.086955444511364,0,0]
  distortion_coeffs: [0,0,0,0]
  distortion_model: radtan
  intrinsics: [644.4385505412966, 643.5879520187435, 455.1775919513420, 304.1616226347153] #fu, fv, cu, cv
  resolution: [960, 600]
  rgb_rostopic: /dalsa_rgb/right/image_raw
  output_rostopic: /output/right/image

  use_sensor_detph: 0
  sensor_depth_rostopic: ""

  use_learned_depth: 0
  model_name_learned_depth: midas-model-v21-small-traced.pt
  learned_depth_rostopic: /camera/learned_depth/image

  use_stereo_matching: 0
  stereo_matching_rostopic: ""

  use_learned_stereo_matching: 0
  model_name_learned_stereo_matching: fast-acvnet-plus-generalization-traced.pt
  # model_name_learned_stereo_matching: foundation_stereo_model_best_bp2.pth.traced.pt
  learned_depth_rostopic: /camera/learned_stereo_matching/image

  use_learned_object_detection: 0
  model_name_learned_object_detection: yolov8n-botanic-garden.cuda.torchscript
  learned_object_detection_rostopic: /camera/object_detection/image

  use_learned_semantic_segmentation: 0
  model_name_learned_semantic_segmentation: yolov8n-seg-botanic-garden.cuda.torchscript
  learned_semantic_segmentation_rostopic: /camera/semantic_segmentation/image
